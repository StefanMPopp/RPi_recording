; =============================================================================
; inventory.ini — which Pis exist and how to reach them
; =============================================================================
;
; Add one line per recording Pi under [pis]. The name on the left (pi1, pi2, …)
; is what you pass to --limit; it must match the host_vars file name, e.g.
; host_vars/pi1.yml.
;
; The dev Pi is deliberately NOT in this list: it is the machine running these
; playbooks, not one of the machines they manage.
;
; After editing, commit and push — the inventory is part of the project record.

[pis]
pi1 ansible_host=192.168.1.101
; pi2 ansible_host=192.168.1.102
; pi3 ansible_host=192.168.1.103
; pi4 ansible_host=192.168.1.104
; pi5 ansible_host=192.168.1.105
; pi6 ansible_host=192.168.1.106
; pi7 ansible_host=192.168.1.107
; pi8 ansible_host=192.168.1.108


; ── Settings applied to every Pi above ───────────────────────────────────────
[pis:vars]
ansible_user=acelab
ansible_ssh_private_key_file=~/.ssh/insect_tracker
ansible_python_interpreter=/usr/bin/python3

; Don't prompt about unknown host keys on first connection. Safe on a private
; lab network; remove if these Pis are ever exposed more widely.
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
