# =============================================================================
# ansible.cfg — defaults, so commands stay short
# =============================================================================
#
# Ansible reads this automatically when a command is run from this directory,
# which means -i inventory.ini can be omitted:
#
#     cd ~/RPi_recording/ansible
#     ansible-playbook update.yml
#     ansible pis -m ping

[defaults]
inventory = ./inventory.ini

# Cleaner output: one block per task per host, rather than a wall of JSON
stdout_callback = yaml

# Don't create .retry files next to the playbooks
retry_files_enabled = False

# The Pis are on a private lab network with keys already distributed
host_key_checking = False

# Show how long each task took — useful for spotting a Pi with a slow SD card
callbacks_enabled = timer

# All eight Pis at once. They're independent, so there's no reason to serialise.
forks = 10

[ssh_connection]
# Reuse SSH connections across tasks; substantially faster over Wi-Fi
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
