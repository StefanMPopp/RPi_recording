site_name: RPi Recording
site_description: Setup, recording, and maintenance guide for the animal video recording rigs
site_url: https://stefanmpopp.github.io/RPi_recording/
repo_url: https://github.com/StefanMPopp/RPi_recording
repo_name: RPi_recording

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Recording:
    - Overview: recording/overview.md
    - Before you start: recording/before_you_start.md
    - The recorder app: recording/recorder_app.md
    - Metadata lists: recording/metadata_lists.md
    - Choosing settings: recording/choosing_settings.md
    - Troubleshooting: recording/troubleshooting.md
  - Setup & maintenance:
    - Overview: setup/overview.md
    - Set up the dev Pi: setup/dev_pi.md
    - Add a new Pi: setup/add_pi.md
    - Replace the dev Pi: setup/replace_dev_pi.md
    - Update all Pis: setup/update_pis.md
    - Day-to-day maintenance: setup/maintenance.md
  - Developer reference:
    - Overview: reference/overview.md
    - Repository layout: reference/repo_layout.md
    - Recorder app architecture: reference/architecture.md
    - File formats: reference/file_formats.md
    - Camera notes: reference/camera_notes.md
    - Working on the code: reference/development.md
    - Handover checklist: reference/handover.md
